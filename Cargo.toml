[package]
name = "karir-ai"
version = "1.1.0"
edition = "2021"
authors = ["Kelompok AI S1 Teknik Informatika <farrelfaiziaulhaq@users.noreply.github.com>"]
description = "Sistem Rekomendasi Lowongan Kerja Hybrid Multikriteria & Constraint-Aware berbasis Rust dan Google Firebase"
license = "MIT"
repository = "https://github.com/farrelfaiziaulhaq/ai-rekomendasi-loker"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
